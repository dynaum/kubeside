version: 2

project_name: kubeside

before:
  hooks:
    - go mod tidy
    # The UI is embedded, so a release built without it would ship the
    # placeholder page. The release workflow builds it first; this is the
    # backstop for a local run.
    - sh -c 'test -f web/dist/index.html || (npm --prefix web ci && npm --prefix web run build)' 

builds:
  - id: kubeside
    main: ./cmd/kubeside
    binary: kubeside
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/dynaum/kubeside/internal/version.Version={{.Version}}
      - -X github.com/dynaum/kubeside/internal/version.Commit={{.ShortCommit}}
      - -X github.com/dynaum/kubeside/internal/version.Date={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

# Homebrew tap reuses the existing dynaum/homebrew-tap repo.
#
# Pushing a formula there is a cross-repository write, which the workflow's own
# GITHUB_TOKEN cannot do. It needs a token with contents:write on the tap, in
# the TAP_GITHUB_TOKEN secret. Without it the formula is still generated into
# dist/homebrew/ and simply not uploaded, because a release that fails after
# building six correct archives helps nobody.
brews:
    # The tap keeps its formulae in Formula/, beside agdog.rb. Without this
    # GoReleaser writes to the repository root, which is why the first v1.0.0
    # attempt was reaching for /kubeside.rb.
  - directory: Formula
    skip_upload: '{{ if .Env.TAP_DEPLOY_KEY }}false{{ else }}true{{ end }}'
    repository:
      owner: dynaum
      name: homebrew-tap
      branch: master
      # Pushed over SSH with a deploy key rather than through the API with a
      # token. A deploy key is scoped to this one repository, belongs to the
      # repository rather than to a person, and does not expire. A fine-grained
      # token expires within 366 days, and the day it does the formula stops
      # being pushed, which is the failure this whole path already had once.
      git:
        url: 'ssh://git@github.com/dynaum/homebrew-tap.git'
        private_key: '{{ .Env.TAP_DEPLOY_KEY }}'
    homepage: https://github.com/dynaum/kubeside
    description: A Kubernetes client scoped to the developer, not the cluster operator
    license: Apache-2.0
    test: |
      system "#{bin}/kubeside", "--version"

release:
  draft: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
